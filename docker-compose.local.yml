name: virtual-patient-local

x-api-environment: &api-environment
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-virtual_patient}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-virtual_patient_local}
  SECRET_KEY: ${SECRET_KEY:-local-development-secret-change-me}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
  SUPERUSER_EMAIL: ${SUPERUSER_EMAIL:-superuser@example.com}
  SUPERUSER_NAME: ${SUPERUSER_NAME:-Super User}
  SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD:-local-superuser-change-me}
  ENV: development
  AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-local-not-configured}
  AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-https://example.invalid}
  AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2025-03-01-preview}
  AZURE_OPENAI_LLM_DEPLOYMENT_NAME: ${AZURE_OPENAI_LLM_DEPLOYMENT_NAME:-local-not-configured}
  AZURE_OPENAI_LLM_MINI_DEPLOYMENT_NAME: ${AZURE_OPENAI_LLM_MINI_DEPLOYMENT_NAME:-local-not-configured}
  AZURE_OPENAI_STT_DEPLOYMENT_NAME: ${AZURE_OPENAI_STT_DEPLOYMENT_NAME:-local-not-configured}
  AZURE_OPENAI_TTS_DEPLOYMENT_NAME: ${AZURE_OPENAI_TTS_DEPLOYMENT_NAME:-local-not-configured}
  AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME:-local-not-configured}
  VIDEO_PROCESSING_WORKER_URL: http://video-processing-worker:8010
  VIDEO_PROCESSING_WORKER_TOKEN: ${VIDEO_PROCESSING_WORKER_TOKEN:-local-video-processing-worker-token}
  VIDEO_PROCESSING_WORKER_TIMEOUT_SECONDS: ${VIDEO_PROCESSING_WORKER_TIMEOUT_SECONDS:-180}
  # Keep native multimedia/scientific libraries from using every host core or
  # creating large per-thread memory pools during gaze and audio analysis.
  OMP_NUM_THREADS: ${MULTIMODAL_CPU_THREADS:-2}
  OPENBLAS_NUM_THREADS: ${MULTIMODAL_CPU_THREADS:-2}
  MKL_NUM_THREADS: ${MULTIMODAL_CPU_THREADS:-2}
  NUMEXPR_NUM_THREADS: ${MULTIMODAL_CPU_THREADS:-2}
  TF_NUM_INTRAOP_THREADS: ${MULTIMODAL_CPU_THREADS:-2}
  TF_NUM_INTEROP_THREADS: ${MULTIMODAL_INTEROP_THREADS:-1}
  MALLOC_ARENA_MAX: ${MULTIMODAL_MALLOC_ARENAS:-2}

x-api-build: &api-build
  context: ./virtual-patient-api
  dockerfile: Dockerfile
  target: development

x-api-image: &api-image virtual-patient-api:local

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-virtual_patient}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-virtual_patient_local}
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-virtual_patient}"]
      interval: 5s
      timeout: 5s
      retries: 20

  setup:
    image: *api-image
    build: *api-build
    environment: *api-environment
    command: ["python", "scripts/setup_db.py"]
    volumes:
      - ./virtual-patient-api:/app
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  api:
    image: *api-image
    build: *api-build
    environment: *api-environment
    cpus: 3.0
    mem_limit: 4g
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./virtual-patient-api:/app
      - interview_media:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5).raise_for_status()"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  video-processing-worker:
    image: *api-image
    build: *api-build
    environment: *api-environment
    cpus: 3.0
    mem_limit: 4g
    command: ["uvicorn", "app.multimodal.video_processing_worker:app", "--host", "0.0.0.0", "--port", "8010"]
    expose:
      - "8010"
    volumes:
      - ./virtual-patient-api:/app
      - interview_media:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8010/health', timeout=5).raise_for_status()"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  ui:
    image: virtual-patient-ui:local
    build:
      context: ./virtual-patient-ui
      dockerfile: Dockerfile
      target: development
    environment:
      VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:-6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI}
      VITE_API_HOST: ${VITE_API_HOST:-http://127.0.0.1}
      VITE_API_PORT: ${VITE_API_PORT:-8000}
      VITE_SPEECH_INPUT_PROVIDER: ${VITE_SPEECH_INPUT_PROVIDER:-server}
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./virtual-patient-ui:/app
      - ui_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_local_data:
  ui_node_modules:
  interview_media:
