name: virtual-patient-local

x-api-environment: &api-environment
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-virtual_patient}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-virtual_patient_local}
  SECRET_KEY: ${SECRET_KEY:-local-development-secret-change-me}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
  # ADMIN_EMAIL / ADMIN_NAME / ADMIN_PASSWORD are intentionally NOT set here.
  # They come from the .env.local env_file below so the administrator account
  # always reflects that file, regardless of how compose is invoked (a bare
  # `docker compose -f docker-compose.local.yml ...` without --env-file would
  # otherwise fall back to a placeholder because interpolation has no source).
  # A service `environment:` value would override env_file, so it is omitted.
  # Local mode pairs the Google public test site key with Google's public test secret, so the widget works on
  # localhost. The real secret is applied only in tunnel mode (docker-compose.tunnel.yml).
  RECAPTCHA_SECRET_KEY: 6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe
  # Public UI origin allowed to call the API through the Cloudflare tunnel.
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://patientbot.com.co}
  ENV: development
  AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-local-not-configured}
  AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-https://example.invalid}
  AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2025-03-01-preview}
  AZURE_OPENAI_LLM_DEPLOYMENT_NAME: ${AZURE_OPENAI_LLM_DEPLOYMENT_NAME:-local-not-configured}
  AZURE_OPENAI_LLM_MINI_DEPLOYMENT_NAME: ${AZURE_OPENAI_LLM_MINI_DEPLOYMENT_NAME:-local-not-configured}
  AZURE_OPENAI_STT_DEPLOYMENT_NAME: ${AZURE_OPENAI_STT_DEPLOYMENT_NAME:-local-not-configured}
  AZURE_OPENAI_TTS_DEPLOYMENT_NAME: ${AZURE_OPENAI_TTS_DEPLOYMENT_NAME:-local-not-configured}
  AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME:-local-not-configured}
  MEDIA_PROCESSING_WORKER_URL: http://media-processing-worker:8010

x-api-build: &api-build
  context: ./virtual-patient-api
  dockerfile: Dockerfile
  target: development

x-api-image: &api-image virtual-patient-api:local

services:
  db:
    image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-virtual_patient}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-virtual_patient_local}
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-virtual_patient}"]
      interval: 5s
      timeout: 5s
      retries: 20

  setup:
    image: *api-image
    build: *api-build
    env_file:
      - ./virtual-patient-api/config/native-runtime.conf
      - path: .env.local
        required: false
    environment: *api-environment
    command: ["python", "-m", "scripts.deployment.setup_db"]
    volumes:
      - ./virtual-patient-api:/app
      - ../:/workspace:ro
      - ../.agents/graphify/graphify-out:/workspace/.agents/graphify/graphify-out
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  api:
    image: *api-image
    build: *api-build
    env_file:
      - ./virtual-patient-api/config/native-runtime.conf
      - path: .env.local
        required: false
    environment: *api-environment
    # Interactive requests are not CPU- or memory-limited; heavy visual work
    # runs in the separately constrained media-processing-worker container.
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./virtual-patient-api:/app
      - interview_media:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5).raise_for_status()"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  media-processing-worker:
    image: *api-image
    build: *api-build
    env_file:
      - ./virtual-patient-api/config/native-runtime.conf
      - path: .env.local
        required: false
    environment: *api-environment
    # P2 deferred processing yields CPU/RAM to live sessions. Native visual work
    # is serialized (concurrency=1) and releases its models after 300s idle, so a
    # smaller cap is safe and keeps the host from being overcommitted.
    cpus: ${WORKER_CPUS:-2.0}
    mem_limit: ${WORKER_MEM_LIMIT:-2560m}
    command: ["uvicorn", "app.multimodal.media_processing_worker:app", "--host", "0.0.0.0", "--port", "8010"]
    expose:
      - "8010"
    volumes:
      - ./virtual-patient-api:/app
      - interview_media:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8010/health', timeout=5).raise_for_status()"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  ui:
    image: virtual-patient-ui:local
    build:
      context: ./virtual-patient-ui
      dockerfile: Dockerfile
      target: development
    environment:
      # Google public test key (set in .env.local as VITE_RECAPTCHA_SITE_TEST_KEY); real keys are tunnel-only.
      VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_TEST_KEY:-6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI}
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./virtual-patient-ui:/app
      - ui_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_local_data:
  ui_node_modules:
  interview_media:
