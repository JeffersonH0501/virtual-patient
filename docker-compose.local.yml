name: virtual-patient-local

x-api-environment: &api-environment
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-virtual_patient}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-virtual_patient_local}
  SECRET_KEY: ${SECRET_KEY:-local-development-secret-change-me}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
  SUPERUSER_EMAIL: ${SUPERUSER_EMAIL:-local.superuser@example.com}
  SUPERUSER_FIRST_NAME: ${SUPERUSER_FIRST_NAME:-}
  SUPERUSER_LAST_NAME: ${SUPERUSER_LAST_NAME:-}
  SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD:-local-superuser-change-me}
  SUPERUSER_PREFERRED_LANGUAGE: ${SUPERUSER_PREFERRED_LANGUAGE:-es}
  ENV: development
  AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-local-not-configured}
  AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-https://example.invalid}
  AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2025-03-01-preview}
  AZURE_OPENAI_LLM_DEPLOYMENT_NAME: ${AZURE_OPENAI_LLM_DEPLOYMENT_NAME:-local-not-configured}
  AZURE_OPENAI_LLM_MINI_DEPLOYMENT_NAME: ${AZURE_OPENAI_LLM_MINI_DEPLOYMENT_NAME:-local-not-configured}
  AZURE_OPENAI_STT_DEPLOYMENT_NAME: ${AZURE_OPENAI_STT_DEPLOYMENT_NAME:-local-not-configured}
  AZURE_OPENAI_TTS_DEPLOYMENT_NAME: ${AZURE_OPENAI_TTS_DEPLOYMENT_NAME:-local-not-configured}
  AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME:-local-not-configured}
  SPEECH_TTS_PROVIDER: ${SPEECH_TTS_PROVIDER:-azure_openai}
  SPEECH_STT_PROVIDER: ${SPEECH_STT_PROVIDER:-azure_openai}
  GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-}
  GCS_CREDENTIALS_PATH: ${GCS_CREDENTIALS_PATH:-}
  MEDIA_STORAGE_ROOT: ${MEDIA_STORAGE_ROOT:-/app/media}
  MEDIA_RETENTION_DAYS: ${MEDIA_RETENTION_DAYS:-}
  MEDIA_CONSENT_POLICY_VERSION: ${MEDIA_CONSENT_POLICY_VERSION:-institutional-v1}
  MEDIA_DURATION_TOLERANCE_MS: ${MEDIA_DURATION_TOLERANCE_MS:-500}
  MEDIA_MIN_FREE_BYTES: ${MEDIA_MIN_FREE_BYTES:-268435456}
  PARAVERBAL_ANALYSIS_ENABLED: ${PARAVERBAL_ANALYSIS_ENABLED:-true}
  PARAVERBAL_MIN_PAUSE_MS: ${PARAVERBAL_MIN_PAUSE_MS:-200}
  PARAVERBAL_MIN_VOICED_DURATION_MS: ${PARAVERBAL_MIN_VOICED_DURATION_MS:-300}
  NONVERBAL_ANALYSIS_ENABLED: ${NONVERBAL_ANALYSIS_ENABLED:-true}
  OPENFACE_DEVICE: ${OPENFACE_DEVICE:-cpu}
  OPENFACE_WEIGHTS_ROOT: ${OPENFACE_WEIGHTS_ROOT:-/app/openface/weights}
  OPENFACE_SAMPLE_FPS: ${OPENFACE_SAMPLE_FPS:-2}
  OPENFACE_GAZE_ALIGNMENT_MAX_RADIANS: ${OPENFACE_GAZE_ALIGNMENT_MAX_RADIANS:-}
  OPENFACE_AU12_INDEX: ${OPENFACE_AU12_INDEX:-}
  OPENFACE_AU12_ACTIVE_THRESHOLD: ${OPENFACE_AU12_ACTIVE_THRESHOLD:-}
  PYFEAT_ANALYSIS_ENABLED: ${PYFEAT_ANALYSIS_ENABLED:-false}
  PYFEAT_DEVICE: ${PYFEAT_DEVICE:-cpu}
  PYFEAT_WEIGHTS_ROOT: ${PYFEAT_WEIGHTS_ROOT:-/app/pyfeat/weights}
  PYFEAT_SAMPLE_FPS: ${PYFEAT_SAMPLE_FPS:-2}
  PYFEAT_GAZE_ALIGNMENT_MAX_RADIANS: ${PYFEAT_GAZE_ALIGNMENT_MAX_RADIANS:-}
  PYFEAT_AU12_ACTIVE_THRESHOLD: ${PYFEAT_AU12_ACTIVE_THRESHOLD:-}

x-api-build: &api-build
  context: ./virtual-patient-api
  dockerfile: Dockerfile

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-virtual_patient}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-virtual_patient_local}
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-virtual_patient}"]
      interval: 5s
      timeout: 5s
      retries: 20

  setup:
    build: *api-build
    environment: *api-environment
    command: ["python", "scripts/setup_db.py"]
    volumes:
      - ./virtual-patient-api:/app
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

  media-init:
    build: *api-build
    user: "root"
    command: ["sh", "-c", "mkdir -p /app/media && chown -R appuser:appuser /app/media"]
    volumes:
      - interview_media:/app/media
    restart: "no"

  openface-init:
    build: *api-build
    user: "root"
    command: ["sh", "-c", "mkdir -p /app/openface && chown -R appuser:appuser /app/openface"]
    volumes:
      - openface_models:/app/openface
    restart: "no"

  pyfeat-init:
    build: *api-build
    user: "root"
    command: ["sh", "-c", "mkdir -p /app/pyfeat/weights && chown -R appuser:appuser /app/pyfeat"]
    volumes:
      - pyfeat_models:/app/pyfeat
    restart: "no"

  api:
    build: *api-build
    environment: *api-environment
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./virtual-patient-api:/app
      - interview_media:/app/media
      - openface_models:/app/openface
      - pyfeat_models:/app/pyfeat
    depends_on:
      postgres:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully
      openface-init:
        condition: service_completed_successfully
      pyfeat-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5).raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ui:
    build:
      context: ./virtual-patient-ui
      dockerfile: Dockerfile
      target: development
    environment:
      VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:-6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI}
      VITE_API_HOST: ${VITE_API_HOST:-http://127.0.0.1}
      VITE_API_PORT: ${VITE_API_PORT:-8000}
      VITE_SPEECH_INPUT_PROVIDER: ${VITE_SPEECH_INPUT_PROVIDER:-server}
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./virtual-patient-ui:/app
      - ui_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_local_data:
  ui_node_modules:
  interview_media:
  openface_models:
  pyfeat_models:
