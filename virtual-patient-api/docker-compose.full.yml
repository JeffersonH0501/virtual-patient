services:
  # PostgreSQL Database with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: virtual-patient-db
    environment:
      POSTGRES_DB: virtual_patient
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password_123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d virtual_patient"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - virtual-patient-network

  # Database Migration Service
  migration:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: virtual-patient-migration
    environment:
      # Database
      POSTGRES_HOST: postgres
      POSTGRES_DB: virtual_patient
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password_123}
      POSTGRES_PORT: 5432
      SQLALCHEMY_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-secure_password_123}@postgres:5432/virtual_patient
      
      # Environment
      ENV: production
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - virtual-patient-network
    restart: "no"

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: virtual-patient-api
    environment:
      # Database
      POSTGRES_HOST: postgres
      POSTGRES_DB: virtual_patient
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password_123}
      POSTGRES_PORT: 5432
      SQLALCHEMY_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-secure_password_123}@postgres:5432/virtual_patient
      
      # Azure OpenAI
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${AZURE_OPENAI_DEPLOYMENT_NAME}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-02-15-preview}
      AZURE_OPENAI_DEPLOYMENT_NAME_MINI: ${AZURE_OPENAI_DEPLOYMENT_NAME_MINI}
      AZURE_OPENAI_API_VERSION_MINI: ${AZURE_OPENAI_API_VERSION_MINI:-2024-02-15-preview}
      AZURE_EMBEDDING_DEPLOYMENT: ${AZURE_EMBEDDING_DEPLOYMENT}
      
      # LiveKit
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      
      # Google Cloud Storage (GCS) - Optional
      # Set GCS_BUCKET_NAME to enable GCS uploads for TTS audio files
      # If using service account JSON file, mount it as volume and set GCS_CREDENTIALS_PATH
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-}
      GCS_CREDENTIALS_PATH: ${GCS_CREDENTIALS_PATH:-}
      
      # Security
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      
      # Environment
      ENV: production
    ports:
      - "8000:8000"
    depends_on:
      migration:
        condition: service_completed_successfully
    volumes:
      - ./logs:/app/logs
      # Note: GCS credentials should be mounted manually if needed:
      # - ./gcs-credentials.json:/app/gcs-credentials.json:ro
    networks:
      - virtual-patient-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=10)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # React Frontend
  ui:
    build:
      context: ../virtual-patient-ui
      dockerfile: Dockerfile.https
      args:
        VITE_API_HOST: ${VITE_API_HOST:-}
        VITE_API_PORT: ${VITE_API_PORT:-}
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY}
    container_name: virtual-patient-ui
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../virtual-patient-ui/ssl:/etc/nginx/ssl:ro  # Mount your SSL certificates
    depends_on:
      api:
        condition: service_healthy
    networks:
      - virtual-patient-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # LiveKit Agent (Optional - for voice functionality)
  livekit-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: virtual-patient-livekit-agent
    command: python start_livekit_agent.py dev
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: virtual_patient
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password_123}
      POSTGRES_PORT: 5432
      SQLALCHEMY_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-secure_password_123}@postgres:5432/virtual_patient
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${AZURE_OPENAI_DEPLOYMENT_NAME}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-02-15-preview}
      AZURE_OPENAI_DEPLOYMENT_NAME_MINI: ${AZURE_OPENAI_DEPLOYMENT_NAME_MINI}
      AZURE_OPENAI_API_VERSION_MINI: ${AZURE_OPENAI_API_VERSION_MINI:-2024-02-15-preview}
      AZURE_EMBEDDING_DEPLOYMENT: ${AZURE_EMBEDDING_DEPLOYMENT}
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-}
      GCS_CREDENTIALS_PATH: ${GCS_CREDENTIALS_PATH:-}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ENV: production
    depends_on:
      api:
        condition: service_healthy
    networks:
      - virtual-patient-network
    restart: unless-stopped
    profiles:
      - livekit  # Only start with --profile livekit

volumes:
  postgres_data:
    driver: local

networks:
  virtual-patient-network:
    driver: bridge
