# Multimodal pipeline — integrated label rules (methodology configuration).
#
# This is one of the two research config files (with thresholds.yaml). It maps
# the per-feature base labels of a family to exactly one integrated label.
# Rules are evaluated in order (priority): the first rule whose conditions all
# hold wins. Condition grammar:
#   all: {slot: value}        -> every slot must equal the given base label (AND)
#   any: {slot: [v1, v2]}     -> slot must equal one of the listed base labels (OR)
# A rule may combine `all` and `any`; both must hold. If no rule matches, the
# `fallback` value is used. `unavailable` names the outcome when the family's
# base labels are insufficient (missing/unavailable required slots).
#
# All labels are in English and are descriptive, provisional research categories,
# not clinical or psychological judgments. To retune the categories, edit the
# `value` names and the base-label values referenced under `all` / `any` (those
# must match the labels produced by thresholds.yaml).
version: "label_rules_v1"

families:
  # PARAVERBAL — temporal. Slots: global_rate, articulation, pause_load,
  # pause_duration, pause_frequency (base labels from thresholds.temporal).
  temporal:
    rules:
      - value: fragmented_by_brief_pauses
        all: {pause_frequency: pause_frequency_high, pause_duration: pause_duration_brief}
      - value: intermittent_by_long_pauses
        all: {pause_duration: pause_duration_long}
        any: {pause_load: [pause_load_high, pause_load_typical]}
      - value: rapid_bursts_with_pauses
        all: {global_rate: speech_rate_high, pause_load: pause_load_high}
      - value: reduced_rate_by_pauses
        all: {global_rate: speech_rate_low, pause_load: pause_load_high}
      - value: slow_continuous_rate
        all: {articulation: articulation_rate_low}
        any: {pause_load: [pause_load_low, pause_load_typical]}
      - value: fast_continuous_rate
        all: {articulation: articulation_rate_high}
        any: {pause_load: [pause_load_low, pause_load_typical]}
      - value: sparse_pauses
        all: {pause_load: pause_load_low, pause_frequency: pause_frequency_low}
      - value: high_pause_load
        all: {pause_load: pause_load_high}
      - value: typical_temporal_pattern
        all: {global_rate: speech_rate_typical, articulation: articulation_rate_typical, pause_load: pause_load_typical}
    fallback: mixed_temporal_pattern_unclassified
    unavailable: unavailable

  # PARAVERBAL — prosodic level. Slots: pitch_level (relative_pitch_shift_st),
  # loudness_level (median_loudness, session-relative).
  prosodic_level:
    session_relative: true
    rules:
      - value: elevated_prosodic_level
        all: {pitch_level: relative_pitch_high, loudness_level: loudness_high}
      - value: reduced_prosodic_level
        all: {pitch_level: relative_pitch_low, loudness_level: loudness_low}
      - value: elevated_pitch
        all: {pitch_level: relative_pitch_high}
      - value: reduced_pitch
        all: {pitch_level: relative_pitch_low}
      - value: elevated_loudness
        all: {loudness_level: loudness_high}
      - value: reduced_loudness
        all: {loudness_level: loudness_low}
      - value: typical_prosodic_level
        all: {pitch_level: relative_pitch_typical, loudness_level: loudness_typical}
    fallback: mixed_prosodic_level_unclassified
    unavailable: unavailable

  # PARAVERBAL — prosodic modulation. Slots: pitch_variation
  # (f0_p20_p80_range_semitones), loudness_variation (loudness_p20_p80_range,
  # session-relative).
  prosodic_modulation:
    session_relative: true
    rules:
      - value: expressive_modulation
        all: {pitch_variation: intonation_variable, loudness_variation: loudness_variability_high}
      - value: reduced_modulation
        all: {pitch_variation: intonation_monotone, loudness_variation: loudness_variability_low}
      - value: expressive_intonation
        all: {pitch_variation: intonation_variable}
      - value: monotone_intonation
        all: {pitch_variation: intonation_monotone}
      - value: marked_loudness_variability
        all: {loudness_variation: loudness_variability_high}
      - value: reduced_loudness_variability
        all: {loudness_variation: loudness_variability_low}
      - value: typical_modulation
        all: {pitch_variation: intonation_typical, loudness_variation: loudness_variability_typical}
    fallback: mixed_modulation_unclassified
    unavailable: unavailable

  # NONVERBAL — visual orientation. Slots: alignment (visual_alignment_ratio),
  # dwell (median_visual_alignment_dwell_ms).
  visual_orientation:
    rules:
      - value: sustained_visual_orientation
        all: {alignment: visual_alignment_high, dwell: visual_dwell_sustained}
      - value: scarce_visual_orientation
        all: {alignment: visual_alignment_low}
      - value: fragmented_visual_orientation
        all: {dwell: visual_dwell_brief}
        any: {alignment: [visual_alignment_mid, visual_alignment_high]}
      - value: typical_visual_orientation
        all: {alignment: visual_alignment_mid, dwell: visual_dwell_typical}
    fallback: mixed_visual_orientation_unclassified
    unavailable: unavailable

  # NONVERBAL — head gestural feedback. Slots: nod_present, nod_rate
  # (session-relative), context (interaction_context passthrough).
  head_gestural_feedback:
    session_relative: true
    rules:
      - value: no_nodding
        all: {nod_present: nod_absent}
      - value: frequent_nodding
        all: {nod_present: nod_observed, nod_rate: nod_rate_high}
      - value: scarce_nodding
        all: {nod_present: nod_observed, nod_rate: nod_rate_low}
      - value: nodding_present
        all: {nod_present: nod_observed}
    fallback: mixed_head_gestural_feedback_unclassified
    unavailable: unavailable

  # NONVERBAL — facial expressivity. Slots: smile_activity (four-band),
  # smile_activation (session-relative).
  facial_expressivity:
    session_relative: true
    rules:
      - value: absent_facial_expressivity
        all: {smile_activity: smile_activity_absent}
      - value: marked_facial_expressivity
        all: {smile_activity: smile_activity_frequent, smile_activation: smile_activation_marked}
      - value: frequent_facial_expressivity
        all: {smile_activity: smile_activity_frequent}
      - value: moderate_facial_expressivity
        all: {smile_activity: smile_activity_moderate}
      - value: scarce_facial_expressivity
        all: {smile_activity: smile_activity_sparse}
    fallback: mixed_facial_expressivity_unclassified
    unavailable: unavailable
