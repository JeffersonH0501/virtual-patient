# Multimodal pipeline — threshold strategies (methodology configuration).
#
# This is one of the two research config files (with label_rules.yaml). It maps
# each processed feature to a base label using a simple, editable strategy per
# feature. Every numeric value here is a PROVISIONAL RESEARCH THRESHOLD, not a
# clinical, diagnostic, or psychological cutoff. `null` band edges mean the band
# is undecided and the feature is feature_unavailable until defined.
#
# All label names are in English. To retune the system you normally only need to
# edit the numbers below (band edges / percentile refs); the label names are the
# descriptive categories those bands produce.
#
# Boundary semantics are explicit per strategy:
#   fixed_bands:
#     value <  low_below               -> labels[0]  (low)
#     low_below <= value <= high_above -> labels[1]  (typical)  [boundaries inclusive to typical]
#     value >  high_above              -> labels[2]  (high)
#   baseline_delta: like fixed_bands but on (feature - baseline); needs PersonalBaseline.
#   session_percentiles:
#     value <  P(low)                  -> low
#     P(low) <= value <= P(high)       -> typical  [percentile boundaries inclusive to typical]
#     value >  P(high)                 -> high
#   binary: threshold on a count/flag (e.g. nod_count > 0).
#   four_band: three ascending breakpoints define four bands (see per-feature note).
version: "thresholds_v1"

# Minimum qualifying turns before session-relative (percentile) references are
# computed. Below this, session-relative families -> insufficient_reference_data.
# Provisional research guard, not a clinical cutoff.
min_turns_for_session_stats: 4

paraverbal:
  # TEMPORAL family — fixed bands (not session-relative). Provisional thresholds.
  temporal:
    speech_rate_wpm:
      strategy: fixed_bands
      low_below: 110          # < 110 -> low ; 110 and 170 -> typical ; > 170 -> high
      high_above: 170
      boundary: inclusive_typical
      labels: [speech_rate_low, speech_rate_typical, speech_rate_high]
    articulation_rate_wpm:
      strategy: fixed_bands
      low_below: 130          # < 130 -> low ; 130 and 210 -> typical ; > 210 -> high
      high_above: 210
      boundary: inclusive_typical
      labels: [articulation_rate_low, articulation_rate_typical, articulation_rate_high]
    median_pause_duration_ms:
      strategy: fixed_bands
      low_below: 500          # < 500 -> brief ; 500 and 1000 -> typical ; > 1000 -> long
      high_above: 1000
      boundary: inclusive_typical
      labels: [pause_duration_brief, pause_duration_typical, pause_duration_long]
    pause_frequency_per_min:
      strategy: fixed_bands
      low_below: 12           # < 12 -> low ; 12 and 24 -> typical ; > 24 -> high
      high_above: 24
      boundary: inclusive_typical
      labels: [pause_frequency_low, pause_frequency_typical, pause_frequency_high]
    pause_time_ratio:
      strategy: fixed_bands
      low_below: 0.15         # < 0.15 -> low ; 0.15 and 0.30 -> typical ; > 0.30 -> high
      high_above: 0.30
      boundary: inclusive_typical
      labels: [pause_load_low, pause_load_typical, pause_load_high]

  # PROSODIC LEVEL family.
  prosodic_level:
    relative_pitch_shift_st:
      strategy: baseline_delta   # (turn_f0_median_st - baseline_f0_median_st)
      low_below: -3              # < -3 st -> low ; -3..+3 -> typical ; > +3 -> high
      high_above: 3
      boundary: inclusive_typical
      labels: [relative_pitch_low, relative_pitch_typical, relative_pitch_high]
    median_loudness:
      strategy: session_percentiles
      low: p25                   # < P25 -> low ; P25..P75 -> typical ; > P75 -> high
      high: p75
      boundary: inclusive_typical
      labels: [loudness_low, loudness_typical, loudness_high]

  # PROSODIC MODULATION family.
  prosodic_modulation:
    f0_p20_p80_range_semitones:
      strategy: fixed_bands
      low_below: 4               # < 4 st -> monotone ; 4..8 -> typical ; > 8 -> variable
      high_above: 8
      boundary: inclusive_typical
      labels: [intonation_monotone, intonation_typical, intonation_variable]
    loudness_p20_p80_range:
      strategy: session_percentiles
      low: p25                   # < P25 -> low ; P25..P75 -> typical ; > P75 -> high
      high: p75
      boundary: inclusive_typical
      labels: [loudness_variability_low, loudness_variability_typical, loudness_variability_high]

nonverbal:
  # VISUAL ORIENTATION family — fixed bands. Provisional thresholds.
  visual_orientation:
    visual_alignment_ratio:
      strategy: fixed_bands
      low_below: 0.30            # < 0.30 -> low ; 0.30..0.65 -> mid ; > 0.65 -> high
      high_above: 0.65
      boundary: inclusive_typical
      labels: [visual_alignment_low, visual_alignment_mid, visual_alignment_high]
    median_visual_alignment_dwell_ms:
      strategy: fixed_bands
      low_below: 500             # < 500 -> brief ; 500..1500 -> typical ; > 1500 -> sustained
      high_above: 1500
      boundary: inclusive_typical
      labels: [visual_dwell_brief, visual_dwell_typical, visual_dwell_sustained]

  # HEAD GESTURAL FEEDBACK family.
  head_gestural_feedback:
    nod_present:
      strategy: binary           # nod_count == 0 -> absent ; nod_count > 0 -> observed
      threshold: 0
      boundary: greater_than     # > threshold counts as present
      labels: [nod_absent, nod_observed]
    nod_rate_min:
      strategy: session_percentiles
      low: p25                   # < P25 -> low ; P25..P75 -> typical ; > P75 -> high
      high: p75
      boundary: inclusive_typical
      labels: [nod_rate_low, nod_rate_typical, nod_rate_high]
    interaction_context:
      strategy: passthrough      # speaking / listening carried through, not thresholded

  # FACIAL EXPRESSIVITY family.
  facial_expressivity:
    smile_activity_ratio:
      strategy: four_band
      # Four bands defined by ascending breakpoints. Boundary semantics:
      #   value == 0            -> band[0] (absent)
      #   0 < value < 0.10      -> band[1] (sparse)
      #   0.10 <= value <= 0.35 -> band[2] (moderate)   [breakpoints inclusive to moderate]
      #   value > 0.35          -> band[3] (frequent)
      breaks: [0.0, 0.10, 0.35]
      boundary: inclusive_middle
      labels: [smile_activity_absent, smile_activity_sparse, smile_activity_moderate, smile_activity_frequent]
    mean_smile_activation:
      strategy: session_percentiles
      low: p25                   # < P25 -> subtle ; P25..P75 -> typical ; > P75 -> marked
      high: p75
      boundary: inclusive_typical
      labels: [smile_activation_subtle, smile_activation_typical, smile_activation_marked]
