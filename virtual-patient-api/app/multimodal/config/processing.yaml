# Multimodal pipeline — derivation parameters (methodology configuration).
#
# Every numeric value in this file is a PROVISIONAL RESEARCH THRESHOLD used to
# derive descriptive observations. None of these are clinical, diagnostic, or
# psychological cutoffs. A value of `null` means the parameter is undecided and
# the dependent feature MUST be treated as feature_unavailable — the pipeline
# never invents a number to fill a null.
version: "processing_v2"

paraverbal:
  # Minimum silence duration counted as a pause. Provisional research threshold.
  # Replaces the prior historical value of 200 ms.
  min_pause_ms: 250
nonverbal:
  gaze:
    # Angular tolerance (radians) for counting a frame as visually aligned with
    # the calibrated interaction center. Undecided: `null` means visual
    # alignment is feature_unavailable until a tolerance is defined. Provisional
    # research threshold, not a clinical cutoff.
    alignment_tolerance_radians: null
  smile:
    # AU12 activation level above which AU12 is considered active. This governs
    # AU12 activity only and is intentionally DISTINCT from the derived
    # smile_activity_ratio feature. Undecided: `null` => feature_unavailable.
    # Provisional research threshold, not a clinical cutoff.
    au12_active_threshold: null
  nod:
    # Deterministic nod detector over the head-pitch series. Enabled as a stage,
    # but its detection parameters are undecided (`null` => the affected feature
    # is feature_unavailable until defined). All values below, once set, are
    # provisional research thresholds, not clinical cutoffs.
    enabled: true
    # Minimum peak-to-trough head-pitch amplitude (degrees) for a nod cycle.
    min_amplitude_deg: null
    # Minimum nod cycle duration (ms). Provisional research threshold.
    min_cycle_ms: null
    # Maximum nod cycle duration (ms). Provisional research threshold.
    max_cycle_ms: null
    # Smoothing window (ms) applied to the head-pitch series before detection.
    smoothing_window_ms: null
