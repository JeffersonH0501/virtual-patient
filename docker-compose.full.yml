name: virtual-patient

x-api-environment: &api-environment
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-virtual_patient}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.full}
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.full}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
  SUPERUSER_EMAIL: ${SUPERUSER_EMAIL:?Set SUPERUSER_EMAIL in .env.full}
  SUPERUSER_NAME: ${SUPERUSER_NAME:?Set SUPERUSER_NAME in .env.full}
  SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD:?Set SUPERUSER_PASSWORD in .env.full}
  ENV: production
  AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:?Set AZURE_OPENAI_API_KEY in .env.full}
  AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:?Set AZURE_OPENAI_ENDPOINT in .env.full}
  AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2025-03-01-preview}
  AZURE_OPENAI_LLM_DEPLOYMENT_NAME: ${AZURE_OPENAI_LLM_DEPLOYMENT_NAME:?Set AZURE_OPENAI_LLM_DEPLOYMENT_NAME in .env.full}
  AZURE_OPENAI_LLM_MINI_DEPLOYMENT_NAME: ${AZURE_OPENAI_LLM_MINI_DEPLOYMENT_NAME:?Set AZURE_OPENAI_LLM_MINI_DEPLOYMENT_NAME in .env.full}
  AZURE_OPENAI_STT_DEPLOYMENT_NAME: ${AZURE_OPENAI_STT_DEPLOYMENT_NAME:?Set AZURE_OPENAI_STT_DEPLOYMENT_NAME in .env.full}
  AZURE_OPENAI_TTS_DEPLOYMENT_NAME: ${AZURE_OPENAI_TTS_DEPLOYMENT_NAME:?Set AZURE_OPENAI_TTS_DEPLOYMENT_NAME in .env.full}
  AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME:?Set AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME in .env.full}

x-api-build: &api-build
  context: ./virtual-patient-api
  dockerfile: Dockerfile

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-virtual_patient}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.full}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-virtual_patient}"]
      interval: 10s
      timeout: 5s
      retries: 20

  setup:
    build: *api-build
    environment: *api-environment
    command: ["python", "scripts/setup_db.py"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    profiles: ["tools"]

  api:
    build: *api-build
    environment: *api-environment
    expose:
      - "8000"
    volumes:
      - ./virtual-patient-api/logs:/app/logs
      - interview_media:/app/media
      - pyfeat_models:/app/pyfeat
    gpus: all
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=10).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  ui:
    build:
      context: ./virtual-patient-ui
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_HOST: ""
        VITE_API_PORT: ""
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:?Set VITE_RECAPTCHA_SITE_KEY in .env.full}
        VITE_SPEECH_INPUT_PROVIDER: ${VITE_SPEECH_INPUT_PROVIDER:-server}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./virtual-patient-ui/ssl:/etc/nginx/ssl:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--insecure", "https://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  interview_media:
  pyfeat_models:
