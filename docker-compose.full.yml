name: virtual-patient

x-api-environment: &api-environment
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-virtual_patient}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.full}
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.full}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
  SUPERUSER_EMAIL: ${SUPERUSER_EMAIL:?Set SUPERUSER_EMAIL in .env.full}
  SUPERUSER_FIRST_NAME: ${SUPERUSER_FIRST_NAME:?Set SUPERUSER_FIRST_NAME in .env.full}
  SUPERUSER_LAST_NAME: ${SUPERUSER_LAST_NAME:?Set SUPERUSER_LAST_NAME in .env.full}
  SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD:?Set SUPERUSER_PASSWORD in .env.full}
  SUPERUSER_PREFERRED_LANGUAGE: ${SUPERUSER_PREFERRED_LANGUAGE:-es}
  ENV: production
  AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:?Set AZURE_OPENAI_API_KEY in .env.full}
  AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:?Set AZURE_OPENAI_ENDPOINT in .env.full}
  AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2025-03-01-preview}
  AZURE_OPENAI_LLM_DEPLOYMENT_NAME: ${AZURE_OPENAI_LLM_DEPLOYMENT_NAME:?Set AZURE_OPENAI_LLM_DEPLOYMENT_NAME in .env.full}
  AZURE_OPENAI_LLM_MINI_DEPLOYMENT_NAME: ${AZURE_OPENAI_LLM_MINI_DEPLOYMENT_NAME:?Set AZURE_OPENAI_LLM_MINI_DEPLOYMENT_NAME in .env.full}
  AZURE_OPENAI_STT_DEPLOYMENT_NAME: ${AZURE_OPENAI_STT_DEPLOYMENT_NAME:?Set AZURE_OPENAI_STT_DEPLOYMENT_NAME in .env.full}
  AZURE_OPENAI_TTS_DEPLOYMENT_NAME: ${AZURE_OPENAI_TTS_DEPLOYMENT_NAME:?Set AZURE_OPENAI_TTS_DEPLOYMENT_NAME in .env.full}
  AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME:?Set AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME in .env.full}
  SPEECH_TTS_PROVIDER: ${SPEECH_TTS_PROVIDER:-azure_openai}
  SPEECH_STT_PROVIDER: ${SPEECH_STT_PROVIDER:-azure_openai}
  GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-}
  GCS_CREDENTIALS_PATH: ${GCS_CREDENTIALS_PATH:-}
  MEDIA_STORAGE_ROOT: ${MEDIA_STORAGE_ROOT:-/app/media}
  MEDIA_RETENTION_DAYS: ${MEDIA_RETENTION_DAYS:-}
  MEDIA_CONSENT_POLICY_VERSION: ${MEDIA_CONSENT_POLICY_VERSION:-institutional-v1}
  MEDIA_DURATION_TOLERANCE_MS: ${MEDIA_DURATION_TOLERANCE_MS:-500}
  MEDIA_MIN_FREE_BYTES: ${MEDIA_MIN_FREE_BYTES:-268435456}
  PARAVERBAL_ANALYSIS_ENABLED: ${PARAVERBAL_ANALYSIS_ENABLED:-true}
  PARAVERBAL_MIN_PAUSE_MS: ${PARAVERBAL_MIN_PAUSE_MS:-200}
  PARAVERBAL_MIN_VOICED_DURATION_MS: ${PARAVERBAL_MIN_VOICED_DURATION_MS:-300}
  NONVERBAL_ANALYSIS_ENABLED: ${NONVERBAL_ANALYSIS_ENABLED:-true}
  OPENFACE_DEVICE: ${OPENFACE_DEVICE:-cpu}
  OPENFACE_WEIGHTS_ROOT: ${OPENFACE_WEIGHTS_ROOT:-/app/openface/weights}
  OPENFACE_SAMPLE_FPS: ${OPENFACE_SAMPLE_FPS:-2}
  OPENFACE_GAZE_ALIGNMENT_MAX_RADIANS: ${OPENFACE_GAZE_ALIGNMENT_MAX_RADIANS:-}
  OPENFACE_AU12_INDEX: ${OPENFACE_AU12_INDEX:-}
  OPENFACE_AU12_ACTIVE_THRESHOLD: ${OPENFACE_AU12_ACTIVE_THRESHOLD:-}
  PYFEAT_ANALYSIS_ENABLED: ${PYFEAT_ANALYSIS_ENABLED:-false}
  PYFEAT_DEVICE: ${PYFEAT_DEVICE:-cpu}
  PYFEAT_WEIGHTS_ROOT: ${PYFEAT_WEIGHTS_ROOT:-/app/pyfeat/weights}
  PYFEAT_SAMPLE_FPS: ${PYFEAT_SAMPLE_FPS:-2}
  PYFEAT_GAZE_ALIGNMENT_MAX_RADIANS: ${PYFEAT_GAZE_ALIGNMENT_MAX_RADIANS:-}
  PYFEAT_AU12_ACTIVE_THRESHOLD: ${PYFEAT_AU12_ACTIVE_THRESHOLD:-}

x-api-build: &api-build
  context: ./virtual-patient-api
  dockerfile: Dockerfile

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-virtual_patient}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.full}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-virtual_patient}"]
      interval: 10s
      timeout: 5s
      retries: 20

  setup:
    build: *api-build
    environment: *api-environment
    command: ["python", "scripts/setup_db.py"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    profiles: ["tools"]

  media-init:
    build: *api-build
    user: "root"
    command: ["sh", "-c", "mkdir -p /app/media && chown -R appuser:appuser /app/media"]
    volumes:
      - interview_media:/app/media
    restart: "no"

  openface-init:
    build: *api-build
    user: "root"
    command: ["sh", "-c", "mkdir -p /app/openface && chown -R appuser:appuser /app/openface"]
    volumes:
      - openface_models:/app/openface
    restart: "no"

  pyfeat-init:
    build: *api-build
    user: "root"
    command: ["sh", "-c", "mkdir -p /app/pyfeat/weights && chown -R appuser:appuser /app/pyfeat"]
    volumes:
      - pyfeat_models:/app/pyfeat
    restart: "no"

  api:
    build: *api-build
    environment: *api-environment
    expose:
      - "8000"
    volumes:
      - ./virtual-patient-api/logs:/app/logs
      - interview_media:/app/media
      - openface_models:/app/openface
      - pyfeat_models:/app/pyfeat
    depends_on:
      postgres:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully
      openface-init:
        condition: service_completed_successfully
      pyfeat-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=10).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  ui:
    build:
      context: ./virtual-patient-ui
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_HOST: ""
        VITE_API_PORT: ""
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:?Set VITE_RECAPTCHA_SITE_KEY in .env.full}
        VITE_SPEECH_INPUT_PROVIDER: ${VITE_SPEECH_INPUT_PROVIDER:-server}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./virtual-patient-ui/ssl:/etc/nginx/ssl:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--insecure", "https://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  interview_media:
  openface_models:
  pyfeat_models:
