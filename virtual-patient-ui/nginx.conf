map "$request_method:$uri" $auth_rate_key {
    default "";
    ~^POST:/api/(auth/token|users)/?$ $binary_remote_addr;
}

map "$request_method:$uri" $transcription_rate_key {
    default "";
    ~^POST:/api/speech/transcriptions/?$ $binary_remote_addr;
}

limit_req_zone $auth_rate_key zone=auth_requests:10m rate=30r/m;
limit_req_zone $transcription_rate_key zone=transcription_requests:10m rate=90r/m;

server {
    listen 80;
    server_name _;
    client_max_body_size 104m;
    root /usr/share/nginx/html;
    index index.html;

    location /health {
        default_type text/plain;
        return 200 "healthy\n";
    }

    location /api/ {
        proxy_pass http://api:8000/;
        limit_req zone=auth_requests burst=20 nodelay;
        limit_req zone=transcription_requests burst=30 nodelay;
        limit_req_status 429;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        location ~ ^/api/medical-interviews/[0-9]+/recording/finalize/?$ {
            # Two 512 MiB video and two 64 MiB audio files plus multipart metadata.
            client_max_body_size 1156m;
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://api:8000;
        }

        location ~ ^/api/medical-interviews/[0-9]+/recording/turns/[^/]+/video/?$ {
            client_max_body_size 68m;
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://api:8000;
        }
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
